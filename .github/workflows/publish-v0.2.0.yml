name: Publish FishRadar v0.2.0
on:
  push:
    branches:
      - codex/publish-v0.2.0
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error 'https://raw.githubusercontent.com/mchenziyi/FishRadar/f1d8b7dd6229e6d28bd9eaac5985c8a16b6dcf4a/releases/FishRadar-v0.2.0-macos-arm64.zip' --output /tmp/FishRadar-v0.2.0-macos-arm64.zip
          echo 'f5ac449e7f00c9ebd93d8a31733cb66a940cd222b913af64bc0d9f7bd39e7d4b  /tmp/FishRadar-v0.2.0-macos-arm64.zip' | sha256sum --check
          gh release create v0.2.0 /tmp/FishRadar-v0.2.0-macos-arm64.zip --repo "$GITHUB_REPOSITORY" --target f422382abc6a49c3a742f7d37975208a1669a9e8 --title 'FishRadar v0.2.0' --notes '新增工作应用自动切换：任一方向进入黄色或红色时切换到选定应用，同一次连续提醒只切换一次。默认关闭，可在设置中选择应用并测试。识别误报可能触发切换，macOS 也可能不接受切换请求。安装包适用于 Apple Silicon Mac，使用临时签名且尚未公证，macOS 可能阻止打开。'
